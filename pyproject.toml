[project]
name = "datacamp-ai-engineer"
version = "0.1.0"
description = "DataCamp Associate AI Engineer Track"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "datasets>=2.19.0",
    "evaluate>=0.4.0",
    "accelerate>=0.30.0",
    "python-dotenv>=1.0.1",
    "jupyterlab>=4.1.0",
    "tqdm>=4.66.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "courses*"]